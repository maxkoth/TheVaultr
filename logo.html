<head>
<meta charset="UTF-8" />

<title>Vaultr — Logo Contact Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0F1020;--muted:#6A6C7E;--line:#E9E9F0;--bg:#F4F4F8;--purple:#5B5BD6;--navy:#1E1B4B;--gold:#F5B301}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 70px}
  .group-head{display:flex;align-items:center;gap:13px;margin:30px 0 18px}
  .group-head:first-child{margin-top:0}
  .group-head h2{font-family:'Sora';font-size:18px;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
  .group-head .ln{height:1px;background:var(--line);flex:1}
  .dot{width:13px;height:13px;border-radius:4px;display:inline-block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(16,16,32,.04);cursor:pointer;transition:.16s;position:relative}
  .cell:hover{box-shadow:0 10px 26px rgba(16,16,32,.09);transform:translateY(-2px)}
  .hd{font-family:'Sora';font-weight:700;font-size:13px;color:var(--muted);margin-bottom:14px}
  .hd b{color:var(--purple);margin-right:7px}
  .logo{display:flex;align-items:center;justify-content:center}
  .logo svg{height:58px;width:auto;max-width:100%}
  .copied{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:#16B364;opacity:0;transition:.2s}
  .cell.show .copied{opacity:1}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>

document.getElementById('grad-defs').innerHTML=GRADS;
const isGold=d=>d.tile==='url(#gNavy)';
function logoSVG(d){return '<svg viewBox="0 0 '+d.wordw+' 96">'+d.word+'</svg>';}
function std(d){return '<svg xmlns="http://www.w3.org/2000/svg" width="'+d.wordw+'" height="96" viewBox="0 0 '+d.wordw+' 96"><defs>'+GRADS+'</defs>'+d.word+'</svg>';}
function cell(d){return '<div class="cell" data-n="'+d.num+'"><div class="hd"><b>'+d.num+'</b>'+d.name+'</div><div class="logo">'+logoSVG(d)+'</div><span class="copied">Copied ✓</span></div>';}
document.getElementById('gG').innerHTML=DATA.filter(isGold).map(cell).join('');
document.getElementById('gP').innerHTML=DATA.filter(d=>!isGold(d)).map(cell).join('');
const byNum={};DATA.forEach(d=>byNum[d.num]=d);
document.querySelectorAll('.cell').forEach(c=>{c.addEventListener('click',async()=>{
  const code=std(byNum[c.dataset.n]);
  try{await navigator.clipboard.writeText(code);}catch(e){const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  c.classList.add('show');setTimeout(()=>c.classList.remove('show'),1200);});});
</script>
