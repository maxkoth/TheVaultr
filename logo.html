<html lang="en">
<head>

<title>Vaultr — Logo Pitch Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0F1020;--muted:#6A6C7E;--line:#E9E9F0;--bg:#F4F4F8;--purple:#5B5BD6;--navy:#1E1B4B;--gold:#F5B301}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  header.top{background:#fff;border-bottom:1px solid var(--line);padding:46px 0 38px;margin-bottom:26px}
  header.top .pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--purple);background:#EEEEFB;padding:6px 13px;border-radius:999px;margin-bottom:16px}
  header.top h1{font-family:'Sora';font-size:33px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
  header.top p{color:var(--muted);font-size:15.5px;max-width:720px}
  .group-head{display:flex;align-items:center;gap:13px;margin:34px 0 16px}
  .group-head h2{font-family:'Sora';font-size:18px;font-weight:700;white-space:nowrap}
  .group-head .ln{height:1px;background:var(--line);flex:1}
  .group-head .star{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);background:var(--gold);padding:5px 11px;border-radius:999px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .vcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(16,16,32,.04)}
  .vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .lab{font-family:'Sora';font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .num{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#EEEEFB;color:var(--purple);font-size:12px;font-weight:700;flex-shrink:0}
  .tag{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:999px}
  .tag.g{color:var(--gold);background:#241F52}.tag.p{color:#fff;background:var(--purple)}
  .btns{display:flex;gap:6px}
  .copybtn{font-size:11px;font-weight:600;color:var(--purple);background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;transition:.16s}
  .copybtn:hover{background:#F4F4FB}.copybtn.done{color:#fff;background:#16B364;border-color:#16B364}
  .vrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logobox{flex:1;min-width:190px;background:var(--bg);border-radius:12px;padding:13px 15px;display:flex;align-items:center;justify-content:center}
  .logobox svg{height:46px;width:auto;max-width:100%}
  .iset{display:flex;align-items:flex-end;gap:10px}
  .icn{filter:drop-shadow(0 5px 14px rgba(16,16,32,.16));border-radius:22.5%}
  .cap{font-size:9.5px;color:var(--muted);text-align:center;margin-top:6px}
  .colwrap{display:flex;flex-direction:column;align-items:center}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:42px 0 60px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}header.top h1{font-size:26px}}
</style>
</head>

document.getElementById('grad-defs').innerHTML=GRADS;
const byNum={};DATA.forEach(d=>byNum[d.num]=d);
const isGold=d=>d.tile==='url(#gNavy)';
function logoSVG(d){return '<svg viewBox="0 0 '+d.wordw+' 96">'+d.word+'</svg>';}
function iconSVG(d,size){return '<svg class="icn" width="'+size+'" height="'+size+'" viewBox="0 0 48 48"><rect width="48" height="48" rx="10.8" fill="'+d.tile+'"/><g transform="translate(9.12,9.12) scale(0.62)">'+d.icon+'</g></svg>';}
function stdLogo(d){return '<svg xmlns="http://www.w3.org/2000/svg" width="'+d.wordw+'" height="96" viewBox="0 0 '+d.wordw+' 96"><defs>'+GRADS+'</defs>'+d.word+'</svg>';}
function stdIcon(d){return '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><defs>'+GRADS+'</defs><rect width="48" height="48" rx="10.8" fill="'+d.tile+'"/><g transform="translate(9.12,9.12) scale(0.62)">'+d.icon+'</g></svg>';}
function card(d){const tag=isGold(d)?'<span class="tag g">Gold</span>':'<span class="tag p">Purple</span>';
  return '<div class="vcard"><div class="vtop"><div class="lab"><span class="num">'+d.num+'</span>'+d.name+tag+'</div>'+
   '<div class="btns"><button class="copybtn" data-n="'+d.num+'" data-t="logo">Logo</button><button class="copybtn" data-n="'+d.num+'" data-t="icon">Icon</button></div></div>'+
   '<div class="vrow"><div class="logobox">'+logoSVG(d)+'</div><div class="colwrap"><div class="iset">'+iconSVG(d,64)+iconSVG(d,40)+'</div><div class="cap">64 · 40 px</div></div></div></div>';}
document.getElementById('gSel').innerHTML=[8,9,15].map(n=>card(byNum[n])).join('');
document.querySelectorAll('.copybtn').forEach(btn=>{btn.addEventListener('click',async()=>{const d=byNum[btn.dataset.n];
  const code=btn.dataset.t==='logo'?stdLogo(d):stdIcon(d);
  try{await navigator.clipboard.writeText(code);}catch(e){const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  const t=btn.textContent;btn.textContent='✓';btn.classList.add('done');setTimeout(()=>{btn.textContent=t;btn.classList.remove('done');},1200);});});
</script>
