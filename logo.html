<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vaultr — Logos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F4F4F8;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 70px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cell{background:#fff;border:1px solid #E9E9F0;border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(16,16,32,.04);cursor:pointer;transition:.16s;position:relative;display:flex;align-items:center;justify-content:center}
  .cell:hover{box-shadow:0 10px 26px rgba(16,16,32,.09);transform:translateY(-2px)}
  .cell svg{height:58px;width:auto;max-width:100%}
  .copied{position:absolute;top:12px;right:14px;font-size:11px;font-weight:700;color:#16B364;opacity:0;transition:.2s;font-family:'Sora',sans-serif}
  .cell.show .copied{opacity:1}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>

function logoSVG(d){return '<svg viewBox="0 0 '+d.wordw+' 96">'+d.word+'</svg>';}
function std(d){return '<svg xmlns="http://www.w3.org/2000/svg" width="'+d.wordw+'" height="96" viewBox="0 0 '+d.wordw+' 96"><defs>'+GRADS+'</defs>'+d.word+'</svg>';}
document.getElementById('g').innerHTML=DATA.map((d,i)=>'<div class="cell" data-i="'+i+'">'+logoSVG(d)+'<span class="copied">Copied ✓</span></div>').join('');
document.querySelectorAll('.cell').forEach(c=>{c.addEventListener('click',async()=>{
  const code=std(DATA[c.dataset.i]);
  try{await navigator.clipboard.writeText(code);}catch(e){const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  c.classList.add('show');setTimeout(()=>c.classList.remove('show'),1200);});});

</html>
